[workspace]
resolver = "2"
members = [
    "crates/vim-buffer",
    "crates/vim-formatter",
    "crates/vim-input",
    "crates/vim-regex",
    "crates/vim-script",
    "crates/vim-ui",
    "crates/display_map",
    "crates/background_worker",
    "crates/vim-clipboard",
    "crates/vim-indexer",
    "crates/vim-macros",
    "crates/textmate",
    "crates/textmate/crates/syntect",
    "crates/vim-treesitter",
    "crates/vim-scanner",
    "crates/vim-colorscheme",
    "crates/files",
    "crates/log",
]
exclude = ["crates/zed"]

[package]
name = "nxvim"
version = "0.1.0"
edition = "2024"
license = "Vim"
publish = false

[package.metadata.deb]
name = "nxvim"
maintainer = "Maintainer <maintainer@example.com>"
description = "A Vim-inspired terminal text editor written in Rust"
extended-description = """
nxvim is a Vim-inspired terminal text editor written in Rust, powered by Zed's ultra-high-performance Rope + SumTree-backed text buffers and concurrent snapshot technologies.
"""
depends = "$dependency, libc6"
section = "editors"
priority = "optional"
assets = [
    ["target/release/nxvim", "usr/bin/nxvim", "755"],
    ["LICENSE", "usr/share/doc/nxvim/copyright", "644"],
]

[package.metadata.generate-rpm]
name = "nxvim"
summary = "A Vim-inspired terminal text editor written in Rust"
description = """
nxvim is a Vim-inspired terminal text editor written in Rust, powered by Zed's ultra-high-performance Rope + SumTree-backed text buffers and concurrent snapshot technologies.
"""
license = "Vim"
assets = [
    { source = "target/release/nxvim", dest = "/usr/bin/nxvim", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/nxvim/LICENSE", mode = "644" }
]


[profile.dev]
debug = 1

[dependencies]
clock = { path = "crates/zed/crates/clock" }
collections = { path = "crates/zed/crates/collections" }
color-eyre = "0.6.5"
crossterm = "0.29"
display_map = { path = "crates/display_map" }
background-worker = { path = "crates/background_worker" }
unicode-width = "0.2"

libloading = "0.9.0"
log = "0.4"

# onig = { version = "6.5.2", default-features = false }
proptest = { version = "1.9", optional = true }
rand = "0.8.5"
rope = { path = "crates/zed/crates/rope" }
serde = { version = "1.0.217", features = ["derive"] }

smallvec = "1.13"
smol = "2.0.2"
sum_tree = { path = "crates/zed/crates/sum_tree" }
syntect = { path = "crates/textmate/crates/syntect" }
text = { path = "crates/zed/crates/text" }

toml = "0.8.19"

unicode-segmentation = "1.12.0"
util = { path = "crates/zed/crates/util" }
vim-buffer = { path = "crates/vim-buffer" }
vim-formatter = { path = "crates/vim-formatter" }
vim-input = { path = "crates/vim-input" }
vim-regex = { path = "crates/vim-regex" }
vim-script = { path = "crates/vim-script" }
vim-ui = { path = "crates/vim-ui" }
vim-clipboard = { path = "crates/vim-clipboard" }
vim-indexer = { path = "crates/vim-indexer" }
vim-macros = { path = "crates/vim-macros" }
textmate = { path = "crates/textmate" }
vim-treesitter = { path = "crates/vim-treesitter" }
vim-scanner = { path = "crates/vim-scanner" }
vim-colorscheme = { path = "crates/vim-colorscheme" }
files = { path = "crates/files" }
nxvim-log = { path = "crates/log" }


