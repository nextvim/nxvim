[package]
name = "vim-buffer"
version = "0.1.0"
edition = "2024"
license = "Vim"
description = "Editor-agnostic Vim-compatible buffer, selection, and mutation engine"
publish = false

[features]
property-tests = ["dep:proptest"]

[dependencies]
clock = { path = "../zed/crates/clock" }
# onig = { version = "6.5.2", default-features = false }
proptest = { version = "1.9", optional = true }
sum_tree = { path = "../zed/crates/sum_tree" }
text = { path = "../zed/crates/text" }
vim-regex = { path = "../vim-regex" }
vim-scanner = { path = "../vim-scanner" }

[[test]]
name = "phase1_properties"
required-features = ["property-tests"]

[[bench]]
name = "phase1_text"
harness = false
